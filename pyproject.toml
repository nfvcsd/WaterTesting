[project]
name = "water-report"
version = "2.0.0"
description = "Daily free chlorine and flow reports from Hach CL17sc datalog exports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "defusedxml>=0.7",
    "openpyxl>=3.1",
]

[project.scripts]
water-report = "water_report.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/water_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
